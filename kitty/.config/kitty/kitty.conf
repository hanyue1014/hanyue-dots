# use kitty +list-fonts
# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 10.0
disable_ligatures never

# cursor
cursor_shape block
cursor_trail 100
cursor_trail_decay 0.2 0.6
cursor_trail_start_threshold 2

# background transparency
background_opacity 0.75
background_blur 64

# use kitty +kitten themes
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME